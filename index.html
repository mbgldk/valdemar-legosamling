<title>Valdemars Legosamling</title>
<meta name="robots" content="noindex, nofollow">

<style>
/* Layout: klodsfarvet top med knopper → "Har han den?"-søgning → temachips → kortgitter (2 kolonner på mobil, 3-4 på iPad) */
:root{
  --bg:#F3F6FA; --card:#FFFFFF; --ink:#18202E; --muted:#5B6578; --line:#DDE3EC;
  --red:#D3262E; --red-ink:#FFFFFF; --yellow:#FFC93C; --blue:#1F6FD6; --green:#2E9E5B;
  --t-city:#DCEAFD; --t-duplo:#FDE0D6; --t-creator:#FFF1C7; --t-technic:#E4E7EC; --t-andet:#DDF3E4;
  --c-city:#1F6FD6; --c-duplo:#D9512C; --c-creator:#B98500; --c-technic:#5B6578; --c-andet:#2E9E5B;
  --ok-bg:#DDF3E4; --ok:#1E7A45; --no-bg:#FFF1C7; --no:#8A6300;
  --display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121722; --card:#1C2331; --ink:#EEF2F8; --muted:#A3ADBF; --line:#2C3547;
  --red:#C8242C; --yellow:#FFC93C; --blue:#5C9DF0; --green:#4CC17E;
  --t-city:#1C2E4A; --t-duplo:#43271F; --t-creator:#3D3317; --t-technic:#2A303C; --t-andet:#1C3A29;
  --c-city:#8AB8F5; --c-duplo:#F29A7E; --c-creator:#F2C94C; --c-technic:#B5BDCB; --c-andet:#7FD6A2;
  --ok-bg:#1C3A29; --ok:#8BE0AC; --no-bg:#3D3317; --no:#F2C94C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121722; --card:#1C2331; --ink:#EEF2F8; --muted:#A3ADBF; --line:#2C3547;
  --red:#C8242C; --yellow:#FFC93C; --blue:#5C9DF0; --green:#4CC17E;
  --t-city:#1C2E4A; --t-duplo:#43271F; --t-creator:#3D3317; --t-technic:#2A303C; --t-andet:#1C3A29;
  --c-city:#8AB8F5; --c-duplo:#F29A7E; --c-creator:#F2C94C; --c-technic:#B5BDCB; --c-andet:#7FD6A2;
  --ok-bg:#1C3A29; --ok:#8BE0AC; --no-bg:#3D3317; --no:#F2C94C; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Toppen: en rød klods set ovenfra */
.top{background:var(--red);color:var(--red-ink);position:relative;padding-block:28px 26px;
  background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.16) 0 9px,rgba(0,0,0,.10) 10px 11px,transparent 12px);
  background-size:34px 34px;background-position:6px 6px}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(2.1rem,7vw,3.4rem);line-height:1;margin:0;text-wrap:balance;letter-spacing:-.01em;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.top .sub{margin:6px 0 0;font-size:.95rem;opacity:.92}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat{background:var(--yellow);color:#18202E;border-radius:10px;padding:8px 14px 6px;box-shadow:0 4px 0 rgba(0,0,0,.22);min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* Søg */
.tools{display:grid;gap:14px;padding-block:22px 6px}
.search label{display:block;font-family:var(--display);font-weight:800;font-size:1.25rem;margin-bottom:6px}
.search-row{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
#q:focus{outline:3px solid var(--blue);outline-offset:1px;border-color:transparent}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
#svar{border-radius:12px;padding:12px 14px;font-weight:700;font-size:1.02rem}
#svar.ja{background:var(--ok-bg);color:var(--ok)} #svar.nej{background:var(--no-bg);color:var(--no)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:.95rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip:disabled{opacity:.4;cursor:default}
.chip i{font-style:normal;opacity:.65;font-variant-numeric:tabular-nums;margin-left:4px}
select{font:inherit;font-size:.95rem;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:40px}
.count{font-size:.9rem;color:var(--muted);margin:14px 0 10px}
#ryd{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:12px;padding:0 16px;min-height:48px;background:var(--ink);color:var(--bg);cursor:pointer}
#ryd:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#q::-webkit-search-cancel-button{display:none}

/* Kort */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;padding-bottom:40px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(20,30,50,.06)}
.pic{background:var(--tint);aspect-ratio:4/3;max-width:100%;position:relative;overflow:hidden}
.pic img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);max-width:none;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.12))}
.brick{position:relative;align-self:flex-start;margin-top:4px;background:var(--yellow);color:#18202E;font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1;padding:8px 10px 6px;border-radius:5px;box-shadow:0 3px 0 rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.brick::before{content:"";position:absolute;top:-5px;left:8px;width:10px;height:5px;border-radius:3px 3px 0 0;background:inherit;box-shadow:16px 0 0 var(--yellow)}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.name{font-family:var(--display);font-weight:800;font-size:1.12rem;line-height:1.15;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.88rem;color:var(--muted)}
.tag{color:var(--tc);background:var(--tint);font-weight:700;border-radius:999px;padding:2px 9px;font-size:.8rem}
.dele{font-variant-numeric:tabular-nums}
.dele b{color:var(--ink)}
.btn{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:700;font-size:.92rem;background:var(--blue);color:#fff;border-radius:10px;padding:10px 8px;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.off{background:var(--line);color:var(--muted);cursor:default}
.btn.off:hover{filter:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px}
footer{color:var(--muted);font-size:.85rem;padding-block:0 32px}
@media (max-width:420px){.name{font-size:1rem}.info{padding:10px 11px 12px}.btn{font-size:.85rem}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
</style>

const THEMES = {City:"city",Duplo:"duplo",Creator:"creator",Technic:"technic","Speed Champions":"technic",Botanical:"andet",Minifigures:"creator"};
const tk = t => THEMES[t] || "andet";
const fmt = n => n.toLocaleString("da-DK");
const $ = id => document.getElementById(id);
let tema = "Alle";

$("sSaet").textContent = SETS.length;
$("sDele").textContent = fmt(SETS.reduce((s,x)=>s+(+x.dele||0),0));
$("sStor").textContent = fmt(Math.max(0,...SETS.map(x=>+x.dele||0)));

const countBy = l => l.reduce((m,x)=>(m[x.tema]=(m[x.tema]||0)+1,m),{});
const all = countBy(SETS);
const order = Object.keys(all).sort((a,b)=>all[b]-all[a]);
$("chips").innerHTML = ["Alle",...order].map(t=>
  `<button class="chip" id="chip-${t}" data-t="${t}">${t}<i></i></button>`).join("");
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b || b.disabled) return;
  tema=b.dataset.t; render();
});
$("sort").addEventListener("change",render);
$("q").addEventListener("input",render);
$("q").addEventListener("keydown",e=>{ if(e.key==="Escape"){ $("q").value=""; render(); } });
$("ryd").addEventListener("click",()=>{ $("q").value=""; render(); $("q").focus(); });

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  // "60337-1" og "60 337" behandles som 60337
  const q = $("q").value.trim().toLowerCase().replace(/^(\d[\d\s]*?)\s*-\s*\d$/,"$1").replace(/^([\d\s]+)$/,m=>m.replace(/\s/g,""));
  $("ryd").hidden = !q;
  // Temaernes tal følger søgningen; temaer uden træf gøres grå
  const found = q ? SETS.filter(x => x.nr.includes(q) || x.navn.toLowerCase().includes(q)) : SETS;
  const c = countBy(found);
  // Har det valgte tema ingen træf i søgningen, vises alle træf i stedet
  const vis = (tema==="Alle" || c[tema]) ? tema : "Alle";
  document.querySelectorAll(".chip").forEach(b=>{
    const t=b.dataset.t, n = t==="Alle" ? found.length : (c[t]||0);
    b.querySelector("i").textContent = n;
    b.disabled = n===0;
    b.setAttribute("aria-pressed", t===vis);
  });
  let list = found.filter(x => vis==="Alle" || x.tema===vis);
  const s = $("sort").value;
  list.sort(s==="dele"?(a,b)=>b.dele-a.dele : s==="nr"?(a,b)=>a.nr.localeCompare(b.nr)
          : s==="navn"?(a,b)=>a.navn.localeCompare(b.navn,"da") : (a,b)=>b.aar-a.aar||b.dele-a.dele);

  const svar = $("svar");
  // Svar Ja/Nej fra 4 cifre (sætnumre har oftest 5, men kan have 4-7)
  const tjek = /^\d{4,}$/.test(q);
  const hit = tjek && SETS.find(x=>x.nr===q);
  if (tjek) {
    svar.hidden = false;
    svar.className = hit ? "ja" : "nej";
    svar.textContent = hit ? `Ja, Valdemar har ${q} – ${hit.navn}.` : `Nej, ${q} er ikke i samlingen endnu. Det kan være en god gave!`;
  } else svar.hidden = true;

  $("count").textContent = q ? `${list.length} sæt passer til "${$("q").value.trim()}"${vis==="Alle"?"":" i "+vis}`
    : list.length===SETS.length ? `Viser alle ${SETS.length} sæt` : `Viser ${list.length} af ${SETS.length} sæt`;
  $("grid").innerHTML = list.length ? list.map(x=>{
    const k=tk(x.tema);
    return `<article class="card" style="--tint:var(--t-${k});--tc:var(--c-${k})">
      <div class="pic"><img src="${x.img}" alt="${esc(x.navn)}" loading="lazy"></div>
      <div class="info">
        <span class="brick">${esc(x.nr)}</span>
        <h2 class="name">${esc(x.navn)}</h2>
        <div class="meta"><span class="tag">${esc(x.tema)}</span><span>${esc(x.aar)}</span><span class="dele"><b>${fmt(+x.dele)}</b> klodser</span></div>
        ${x.vejl===false
          ? `<span class="btn off" aria-disabled="true">Ingen vejledning</span>`
          : `<a class="btn" href="https://www.lego.com/da-dk/service/building-instructions/${esc(x.nr)}" target="_blank" rel="noopener">Byggevejledning ↗</a>`}
      </div></article>`;}).join("")
    : `<p class="empty">Ingen sæt passer. Prøv et andet tema eller nummer.</p>`;
}
render();
</script>
